<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Chaos: Urlaub</title></head><body>
<style>:root{padding-top:0px;padding-bottom:0px}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: Szene als Puppenhaus-Bühne (hochkant oben, quer links), Figuren-Tabs + Aktionsliste (hochkant unten, quer rechts) */
:root{
  --bg:#151829; --panel:#1f2340; --panel2:#2a2f57; --line:#3a4072; --fg:#f4efe4; --muted:#a9acc9;
  --sun:#ffc857; --coral:#ff7a59; --sea:#4cc3d9; --good:#6fd38b; --bad:#ff6b6b;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1280px;margin:0 auto;
  padding-left:max(16px,0px);padding-right:max(16px,0px);padding-top:8px;padding-bottom:8px}
.top{display:flex;align-items:center;gap:10px;flex:none}
.stg{display:flex;flex-direction:column;min-width:0;flex:1}
.stg .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stg .nm{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:3px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--sun)} .dots i.done{background:var(--good)}
.clock{text-align:right;flex:none}
.clock b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;color:var(--sun)}
.clock small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.ibtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:16px;cursor:pointer}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.left,.right{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.right{flex:1}
.scene{border-radius:14px;overflow:hidden;background:#0e1020;flex:none}
.scene svg{display:block;width:100%;height:auto;max-height:36vh}
.log{font-size:13px;line-height:1.35;color:var(--muted);min-height:1.35em}
.log p{margin:0}
.log p:first-child{color:var(--fg);font-weight:700}
.log p:not(:first-child){display:none}
.tasks{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.chip .mb{display:inline-block;width:60px;height:7px;border-radius:4px;background:#0f1122;overflow:hidden;vertical-align:middle;margin:0 4px}
.chip .mb i{display:block;height:100%}
.chip.ok{background:#1f3b30;border-color:#2f6b4c;color:var(--good)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 7px;border-radius:12px;border:2px solid transparent;background:var(--panel);cursor:pointer}
.tab.sel{border-color:var(--sun);background:var(--panel2)}
.tab svg{width:40px;height:40px}
.tab .who{font-family:var(--display);font-weight:600;font-size:14px;line-height:1}
.tab .role{font-size:10px;color:var(--muted);font-weight:700}
.bar{width:88%;height:6px;border-radius:3px;background:#0f1122;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.acts{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr;gap:6px;align-content:start;padding-bottom:4px}
.acts h3{margin:4px 2px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.act{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-width:0}
.act:hover{background:var(--panel2)}
.act .ic{font-size:20px;width:26px;text-align:center;flex:none}
.act .tx{min-width:0;display:flex;flex-direction:column}
.act .lb{font-weight:800;font-size:14px;line-height:1.2}
.act .sb{font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.act.adv{border-color:var(--sun);background:#3a3218}
.act.lock{opacity:.45;cursor:not-allowed}
.act.task .lb::after{content:" ★";color:var(--sun)}
@media (min-width:520px) and (max-aspect-ratio:5/4){.acts{grid-template-columns:1fr 1fr}.acts h3{grid-column:1/-1}}
@media (min-aspect-ratio:5/4) and (min-width:560px){
  .main{flex-direction:row}
  .left{flex:1.45} .right{flex:1}
  .scene svg{max-height:62vh}
  .log p:not(:first-child){display:block}
}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(8,9,20,.78);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,0px) max(16px,0px) max(16px,0px) max(16px,0px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
.card .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);font-weight:800}
.card p{margin:0;line-height:1.45}
.card ul{margin:0;padding-left:18px;line-height:1.5}
.card li.bad{color:#ffb3a8} .card li.good{color:#a8ecbc}
.ch{display:flex;flex-direction:column;gap:6px}
.btn{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left;font-weight:800;font-size:15px}
.btn small{display:block;font-weight:700;font-size:11.5px;color:var(--muted)}
.btn.pri{background:var(--sun);color:#2a1d00;border-color:var(--sun);text-align:center}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;font-weight:800}
.moods b{display:block;font-family:var(--display);font-size:20px}
.big{font-family:var(--display);font-size:54px;color:var(--sun);line-height:1;font-variant-numeric:tabular-nums}
.pop{font-family:var(--display);font-weight:700;font-size:18px;animation:pop 1.4s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.4}to{opacity:1}}
.drift{animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-160px)}}
.wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(18px)}}
.fly{animation:fly 14s linear infinite}
@keyframes fly{from{transform:translateX(-120px)}to{transform:translateX(900px)}}
@media (prefers-reduced-motion:reduce){.pop,.bob,.glow,.drift,.wave,.fly{animation:none}}
/* Switch / alte Browser */
#app>*+*,.main>*+*,.left>*+*,.right>*+*,.card>*+*,.ch>*+*{margin-top:8px}
.top>*+*{margin-left:10px}
.dots>*+*{margin-left:4px}
.tasks>*{margin:0 5px 5px 0}
.tab>*+*{margin-top:2px}
.act>*+*{margin-left:10px}
.tabs{grid-gap:6px}.acts{grid-gap:6px}.moods{grid-gap:6px}
.acts>*{margin:0!important}
@media (min-aspect-ratio:5/4) and (min-width:560px){
  .main>*+*{margin-top:0;margin-left:10px}
  body{font-size:16px}
  .act .lb{font-size:16px}.act .sb{font-size:13px}
  .tab svg{width:52px;height:52px}.tab .who{font-size:16px}
  .log{font-size:15px}
}
</style>

<div id="app">
  <div class="top">
    <div class="stg"><span class="eyebrow" id="eyebrow">Family Chaos: Urlaub</span><span class="nm" id="stname">…</span><div class="dots" id="dots"></div></div>
    <div class="clock"><b id="clock">6:00</b><small id="deadline"></small></div>
    <button class="ibtn" id="mute" aria-label="Ton an/aus">🔊</button>
    <button class="ibtn" id="menu" aria-label="Menü">☰</button>
  </div>
  <div class="main">
    <div class="left">
      <div class="scene"><svg id="scene" viewBox="0 0 800 340" role="img" aria-label="Spielszene"></svg></div>
      <div class="log" id="log"></div>
      <div class="tasks" id="tasks"></div>
    </div>
    <div class="right">
      <div class="tabs" id="tabs"></div>
      <div class="acts" id="acts"></div>
    </div>
  </div>
</div>
<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>

<script>
var CH = ["S", "R", "T", "M"];
var INFO = {
  S: { role: "Papa", shirt: "#3f7fd8", hair: "#3a3b42" },
  R: { role: "Mama", shirt: "#ea8bb8", hair: "#6b4226" },
  T: { role: "11 Jahre", shirt: "#d8453a", hair: "#764727" },
  M: { role: "9 Jahre", shirt: "#1e3a6e", hair: "#b2834f" }
};
var MELT = { S: "Oh nee, ich will meine Ruhe!", R: "Ich mach hier alles allein!", T: "Ich hab HUNGER!", M: "Bäh! Alles bäh!" };
var st = null;
function A(id, label, ico, mins, o) {
  o = o || {};
  o.id = id;
  o.label = label;
  o.ico = ico;
  o.mins = mins;
  return o;
}
function hm(t) {
  var h = Math.floor(t / 60) % 24, m = t % 60;
  return h + ":" + (m < 10 ? "0" : "") + m;
}
function cur() {
  return STAGES[st.stage];
}
function T(id) {
  return !!st.tasks[id];
}
function F(id) {
  return !!st.flags[id];
}
function val(v) {
  return typeof v === "function" ? v() : v;
}
function asleep() {
  return F("asleep");
}
function awake() {
  return !F("asleep");
}
function wake() {
  st.flags.asleep = false;
}
function sunPen() {
  return !T("eincremen") && st.t >= 600 ? -8 : 0;
}
function out(c, base) {
  return function() {
    var o = {};
    for (var k in base) o[k] = base[k];
    o[c] = (o[c] || 0) + sunPen();
    return o;
  };
}
function burn(c) {
  return function() {
    if (sunPen()) {
      st.flags["burn" + c] = 1;
      addLog(c + " bekommt Sonnenbrand. Autsch.");
    }
  };
}
function burnAll() {
  if (sunPen()) {
    CH.forEach(function(c) {
      st.flags["burn" + c] = 1;
    });
    addLog('Alle kriegen Sonnenbrand. R: „Ich hab es GESAGT."');
  }
}
function inc(k, n) {
  st.cnt[k] = (st.cnt[k] || 0) + (n === void 0 ? 1 : n);
}
function brot(n) {
  var k = Math.min(n, st.brote);
  st.brote -= k;
  inc("brote", k);
}
function laut(v) {
  if (!v) return;
  st.laut = Math.max(0, Math.min(100, st.laut + v));
  if (st.laut > st.maxLaut) st.maxLaut = st.laut;
}
function pick(a) {
  return a[Math.floor(Math.random() * a.length)];
}
function th(id) {
  return st.flags.theme === id;
}
var LOGIK = ["Sudoku Stufe 5. Läuft.", "Wenn A lügt und B die Wahrheit sagt … Moment.", "Zahlenreihe 2, 6, 12, 20 … 30! Naturtalent.", "Heft 7 durch. Ich hab noch drei dabei.", "Pssst. Ich bin im Flow."];
var THEMES = {
  altstadt: { name: "Altstadt", ico: "🏛️", sun: "#ffb55a", text: "Kopfsteinpflaster, Gelato und ein Stadtführer mit Regenschirm." },
  boot: { name: "Bootsfahrt", ico: "⛵", sun: "#4cc3d9", text: "Ein kleines Boot schaukelt raus aufs Meer. In der Bucht ist ein Badestopp." },
  leucht: { name: "Leuchtturm", ico: "🗼", sun: "#ff7a7a", text: "Ein rot-weißer Leuchtturm auf den Klippen. 214 Stufen. R hat sie gezählt." },
  aqua: { name: "Aquarium", ico: "🦈", sun: "#7be0c3", text: "Plan B wegen Regen: Haie, Pinguine und ein Tunnel unter Wasser." }
};
function nextTheme() {
  return th("altstadt") ? "boot" : F("regen") ? "aqua" : "leucht";
}
function goTheme(id) {
  st.flags.theme = id;
  var t = THEMES[id];
  st.queue = { id: "tw" + id, title: "Themawechsel: " + t.ico + " " + t.name, text: t.text, choices: [{ label: "Los geht's!" }] };
}
var STAGES = [
  {
    id: "home",
    name: "Koffer packen",
    short: "Zuhause",
    start: 360,
    end: 480,
    endLabel: "Taxi kommt",
    intro: "6:00 Uhr. Um 8:00 steht das Taxi zum Flughafen vor der Tür. Mogli miaut wie jeden Morgen. Papa schläft noch. Der Katzensitter kommt gleich und zieht für zwei Wochen ein.",
    timeUp: "8:00 – Das Taxi hupt. Alle rein, egal wie!",
    tasks: [["packed", "Koffer gepackt"], ["koffer", "Koffer zu"], ["pass", "Pässe"], ["creme", "Sonnencreme"], ["kabel", "Ladekabel"], ["sitter", "Katzensitter eingewiesen"], ["herd", "Herd aus"]],
    init: function() {
      st.flags.asleep = true;
    },
    actions: {
      S: [
        A("snooze", "Noch 5 Minuten", "😴", 10, { repeat: true, req: asleep, fx: { S: 6, R: -4 }, say: "Zzz… noch fünf Minuten…" }),
        A("aufstehen", "Aufstehen", "🥱", 5, { req: asleep, fx: { S: -6 }, run: wake, say: "Oh nee. Urlaub ist anstrengend." }),
        A("pass", "Pässe suchen", "🛂", 15, { req: awake, task: "pass", fx: { S: -4, R: 3 }, say: "Die waren … in der Brotdose?!" }),
        A("zusitzen", "Koffer zusitzen", "🧳", 10, {
          req: awake,
          lock: function() {
            return T("packed") ? "" : "Erst muss R packen";
          },
          task: "koffer",
          fx: function() {
            return F("lego") ? { S: -8, T: 4 } : { S: -3 };
          },
          say: function() {
            return F("lego") ? "T, setz dich mit drauf! Eins, zwei, DREI!" : "Passt. Hab ich doch gesagt.";
          }
        }),
        A("herdS", "Herd checken", "🔥", 5, { req: awake, task: "herd", fx: { S: 2 }, say: "Herd ist aus. Glaub ich. Ziemlich sicher." }),
        A("kaffee", "Kaffee im Stehen", "☕", 10, { req: awake, fx: { S: 10 }, say: "Ohne Kaffee kein Urlaub." }),
        A("nelli", "Nelli auf dem Schoß", "🐈", 10, { req: awake, fx: { S: 8, R: -3 }, say: "Ich kann nicht aufstehen. Nelli liegt da." })
      ],
      R: [
        A("packen", "Koffer nach Liste packen", "📋", 20, { task: "packed", fx: { R: -6 }, say: "Die Liste hat inzwischen drei Seiten." }),
        A("creme", "Sonnencreme einpacken", "🧴", 5, { task: "creme", fx: { R: 2 }, say: "LSF 50. Für alle. Keine Diskussion." }),
        A("sitter", "Katzensitter einweisen", "🐾", 20, {
          lock: function() {
            return F("sitterHere") ? "" : "Er ist noch nicht da (kommt gegen 6:30)";
          },
          task: "sitter",
          fx: { R: -4 },
          say: "Nia frisst alles, Nelli jagt Nia, Nala ist … Nala. Mogli schreit um sechs."
        }),
        A("snacks", "Snacks schmieren", "🥪", 15, { flag: "snacks", fx: { R: -2, T: 2, M: 2 }, say: "Acht Brote. T isst davon sechs." }),
        A("weckenR", "Papa wecken", "⏰", 5, { req: asleep, fx: { R: 3, S: -8 }, run: wake, say: "Schatz. Das TAXI." }),
        A("herdR", "Herd checken", "🔥", 5, { task: "herd", fx: { R: 2 }, say: "Aus. Ich hab ein Foto gemacht, zur Sicherheit." })
      ],
      T: [
        A("lego", "Lego einpacken", "🧱", 10, { req: function() {
          return !F("lego") && !st.done.legoraus;
        }, flag: "lego", fx: { T: 12, R: -4 }, say: "Nur die wichtigsten 2000 Steine." }),
        A("legoraus", "Lego wieder auspacken", "🧱", 10, { req: function() {
          return F("lego");
        }, unflag: "lego", fx: { T: -10, R: 5 }, say: "Na gut. Nur noch 200 Steine." }),
        A("kabel", "Ladekabel suchen", "🔌", 10, { task: "kabel", fx: { T: 3 }, say: "Lag unterm Sofa. Bei Mogli." }),
        A("wanders", "Wanders einpacken", "🐿️", 5, { flag: "wanders", fx: { T: 8 }, say: "Wanders braucht auch mal Urlaub." }),
        A("weckenT", "Papa wecken (Bauchplatscher)", "💥", 5, { req: asleep, fx: { T: 8, S: -15 }, run: wake, say: "URLAUB!!!" })
      ],
      M: [
        A("fuffi", "Fuffi einpacken", "🐶", 5, { flag: "fuffi", fx: { M: 10, R: -3 }, say: "Fuffi passt nicht in den Koffer. Fuffi kommt trotzdem mit." }),
        A("ketchup", "Ketchup ins Handgepäck", "🍅", 5, { flag: "ketchup", fx: { M: 6 }, say: "Für den Notfall. Am Meer gibt es bestimmt keinen." }),
        A("ball", "Fußball einpacken", "⚽", 5, { flag: "ball", fx: { M: 4, R: -2 }, say: "Der muss mit. Der ist schon eingespielt." }),
        A("tschuess", "Katzen verabschieden", "🐈", 10, { fx: { M: 6 }, say: "Tschüss Nia, Nelli, Nala … Mogli? MOGLI?" }),
        A("weckenM", "Papa wecken (Fuffi aufs Gesicht)", "🐶", 5, { req: asleep, fx: { M: 8, S: -10 }, run: wake, say: "Fuffi sagt: AUFSTEHEN!" })
      ]
    },
    family: [A("taxi", "Ins Taxi steigen", "🚕", 0, { advance: true, lock: function() {
      return asleep() ? "Papa schläft noch" : "";
    } })],
    events: [
      {
        id: "sitterKommt",
        force: true,
        cond: function() {
          return st.t >= 390;
        },
        title: "DING DONG!",
        text: 'Der Katzensitter steht mit zwei Taschen vor der Tür. Er hat schon die erste Frage: „Welche ist Nala?"',
        choices: [{ label: "Rein mit ihm!", flag: "sitterHere", fx: { R: 2 } }]
      },
      {
        id: "nia",
        force: true,
        cond: function() {
          return T("packed") && !T("koffer");
        },
        title: "Der Koffer miaut",
        text: "Im offenen Koffer liegt Nia zwischen den Badehosen und schnurrt.",
        choices: [
          { label: "Nia rausheben", mins: 5, fx: { M: 3, R: -2 }, say: "Raus da, du Schnurrbrocken." },
          { label: '„Nia darf mit!"', fx: { M: 6, R: -8 }, sayBy: "R", say: "Nein. NEIN. Nia bleibt hier." }
        ]
      },
      {
        id: "nala",
        cond: function() {
          return !T("packed");
        },
        title: "Nala hilft",
        text: "Nala hat sich auf die Packliste gelegt und denkt nicht daran, aufzustehen.",
        choices: [
          { label: "Liste unter Nala rausziehen", fx: { R: -4 }, sayBy: "R", say: "Nala, das ist keine Decke." },
          { label: "Nala liegen lassen", fx: { S: 3, R: -2 }, sayBy: "S", say: "Lass sie. Sie versteht eh nix." }
        ]
      },
      {
        id: "mogli",
        title: "Mogli hat ein Geschenk",
        text: "Mogli hat vor die Haustür gekotzt. Natürlich heute.",
        choices: [
          { label: "Ich mach das weg", mins: 5, fx: { sel: -6 } },
          { label: "Das macht der Katzensitter", cond: function() {
            return F("sitterHere");
          }, fx: { all: 2, R: -2 }, sayBy: "R", say: "Willkommen im Team!" }
        ]
      },
      {
        id: "nelliJagd",
        title: "Katzenrennen",
        text: "Nelli jagt Nia quer durch den Flur. Ein Blumentopf kippt um.",
        choices: [{ label: "Aufkehren", mins: 5, fx: { sel: -3 } }, { label: "Später …", fx: { R: -5 } }]
      }
    ],
    finish: function(m) {
      if (!T("koffer")) {
        m.push({ bad: 1, t: "Der Koffer ist noch offen. Im Taxi wird gestopft." });
        fx({ R: -12, S: -6 });
      }
      if (!T("pass")) {
        m.push({ bad: 1, t: "Pässe vergessen! Das Taxi dreht nach zwei Kilometern um." });
        st.flags.late = 1;
        fx({ all: -8 });
      }
      if (!T("creme")) m.push({ bad: 1, t: "Die Sonnencreme steht noch im Bad." });
      if (!T("kabel")) m.push({ bad: 1, t: "Das Ladekabel liegt noch unterm Sofa. Bei Mogli." });
      if (!T("sitter")) {
        m.push({ bad: 1, t: "Der Katzensitter winkt ratlos aus der Tür." });
        st.flags.sitterConfused = 1;
      }
      if (!T("herd")) {
        m.push({ bad: 1, t: "Ob der Herd aus ist? Keiner weiß es." });
        st.flags.herdWorry = 1;

    return '<button class="' + cls + '" data-g="' + grp + '" data-i="' + i + '"' + (lk ? ' aria-disabled="true"' : "") + '><span class="ic">' + a.ico + '</span><span class="tx"><span class="lb">' + esc(val(a.label)) + '</span><span class="sb">' + esc(sub.filter(Boolean).join(" · ")) + "</span></span></button>";
  };
  html += "<h3>Als " + c + " (" + INFO[c].role + ")</h3>" + list.map(function(a, i) {
    return btn(a, i, "c");
  }).join("");
  if (!list.length) html += '<p class="log">Gerade nichts zu tun. Wechsel die Figur.</p>';
  html += "<h3>Ganze Familie</h3>" + fam.map(function(a, i) {
    return btn(a, i, "f");
  }).join("");
  var el = document.getElementById("acts");
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll(".act"), function(b) {
    b.onclick = function() {
      var arr = b.getAttribute("data-g") === "c" ? list : fam;
      doAction(arr[+b.getAttribute("data-i")]);
    };
  });
}
function modal(html) {

var AC = null, muted = false;
try {
  muted = localStorage.getItem("fcu-mute") === "1";
} catch (e) {
}
function snd(k) {
  if (muted) return;
  try {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
    }
    var now = AC.currentTime;
    if (k === "miau") {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(600, now);
      o.frequency.linearRampToValueAtTime(1050, now + 0.15);
      o.frequency.linearRampToValueAtTime(520, now + 0.45);
      g.gain.setValueAtTime(1e-4, now);
      g.gain.exponentialRampToValueAtTime(0.06, now + 0.05);
      g.gain.exponentialRampToValueAtTime(1e-4, now + 0.5);
      o.connect(g);
      g.connect(AC.destination);
      o.start(now);
      o.stop(now + 0.55);
      return;
    }
    var seq = { click: [[520, 0.05]], good: [[660, 0.07], [880, 0.11]], bad: [[300, 0.1], [210, 0.16]], ding: [[880, 0.25], [660, 0.4]], win: [[523, 0.1], [659, 0.1], [784, 0.1], [1046, 0.3]] }[k] || [];
    var t = now;
    seq.forEach(function(n) {
      var o2 = AC.createOscillator(), g2 = AC.createGain();
      o2.type = "triangle";
      o2.frequency.value = n[0];
      g2.gain.setValueAtTime(1e-4, t);
      g2.gain.exponentialRampToValueAtTime(0.12, t + 0.015);
      g2.gain.exponentialRampToValueAtTime(1e-4, t + n[1]);
      o2.connect(g2);
      g2.connect(AC.destination);
      o2.start(t);
      o2.stop(t + n[1] + 0.02);
      t += n[1] * 0.9;
    });
  } catch (e) {
  }
}
